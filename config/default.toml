# Example configuration. Missing keys use application defaults.
# This file is loaded only when explicitly supplied with --config.
[app]
debug = false

[video]
width = 1280
height = 720
fps = 30

[performance]
# Profiled defaults for an 8-logical-CPU Windows development machine.
tracking_fps = 10
opencv_threads = 4

[transport]
enabled = true
name = "facelive_frames_v1"
slot_count = 3
capacity_width = 1280
capacity_height = 720
consumer_timeout_ms = 2000
checksum = true

[renderer]
backend = "geometric"
# Optional local neural provider. It is imported only for backend = "liveportrait".
runtime_module = "facelive_liveportrait"
device = "auto"
# Default: %LOCALAPPDATA%/FaceLive/models/liveportrait
# Relative paths resolve from this TOML file's directory.
# model_directory = "../models/liveportrait"

[logging]
level = "INFO"
max_bytes = 2000000
backup_count = 3
# Default: %LOCALAPPDATA%/FaceLive/logs
# Relative paths resolve from this TOML file's directory.
# directory = "../logs"
