[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "facelive"
version = "0.0.1"
description = "Local reference-face desktop application — milestone 0 shell"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "PySide6>=6.8,<7",
]

[project.scripts]
facelive = "app.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".bootstrap"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
