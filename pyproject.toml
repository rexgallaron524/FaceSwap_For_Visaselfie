[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "facelive"
version = "0.0.1"
description = "Local reference-face desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cv2-enumerate-cameras>=1.2,<2",
    "mediapipe>=0.10.35,<0.11",
    "numpy>=2.2,<3",
    "opencv-contrib-python>=5,<6",
    "PySide6>=6.8,<7",
]

[project.scripts]
facelive = "app.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"models/face_landmarker.task" = "app/reference/assets/face_landmarker.task"
"models/LICENSE.face-landmarker.txt" = "app/reference/assets/LICENSE.face-landmarker.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".bootstrap"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
